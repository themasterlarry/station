<title>Passwords — Station</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202A; --ink-2:#22303D; --ink-3:#35485A; --paper:#F3F5EF; --bar:#DDE9D4;
  --rule:#C3CDBB; --stamp:#B0402E; --tick:#E3A62C; --tick-deep:#8A6414;
  --pos:#2C6B4C; --dim:#6B7A6B; --mute:#8FA3A8; --pad:16px;
  --disp:"Archivo Narrow",Helvetica Neue,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme=dark]{
  --paper:#141A20; --card:#1B232B; --card2:#202931; --hover:#26313A;
  --text:#E3E8DF; --bar:#1F2932; --rule:#35424C; --dim:#94A296; --mute:#8FA3A8;
  --ink:#0D1318; --ink-2:#18212A; --ink-3:#35424C;
  --stamp:#D9705C; --pos:#63B08A; --tick:#E3A62C; --tick-deep:#C79433;
  --warm:#3A3020; --bad:#3A2320; --on-tick:#2A1F05;
}
[data-theme=dark] .empty b{color:var(--text)}
[data-theme=dark] .warn{color:#F0DCB4}
[data-theme=dark] .offline{color:#F2C9C0}
[data-theme=dark] .ticket,[data-theme=dark] .ticket.owed-to-me{color:#1C2A16}
[data-theme=dark] .genout{background:#000;color:#DFF0DA}
[data-theme=dark] img,[data-theme=dark] .doc .thumb img{filter:brightness(.92)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.shell{display:flex;min-height:100vh}
.rail{width:196px;flex:0 0 196px;background:var(--ink);color:var(--on-ink);padding:16px 0 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 16px 14px;border-bottom:1px solid var(--ink-3);margin-bottom:10px;text-decoration:none;display:block;color:inherit}
.brand .mk{font-family:var(--disp);text-transform:uppercase;letter-spacing:.24em;font-size:13px;font-weight:700}
.brand .sub{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:3px}
.rail a.nv{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--mute);text-decoration:none;border-left:3px solid transparent}
.rail a.nv .cd{font-family:var(--mono);font-size:10px;font-weight:600;border:1px solid var(--ink-3);border-radius:2px;padding:2px 4px;min-width:26px;text-align:center;letter-spacing:.05em}
.rail a.nv .lb{font-family:var(--disp);text-transform:uppercase;letter-spacing:.11em;font-size:12px}
.rail a.nv .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tick)}
.rail a.nv:hover{color:var(--on-ink);background:var(--ink-2)}
.rail a.nv[aria-current=page]{color:var(--on-ink);border-left-color:var(--tick);background:var(--ink-2)}
.rail a.nv[aria-current=page] .cd{border-color:var(--tick);color:var(--tick)}
.railfoot{padding:14px 16px 0;margin-top:12px;border-top:1px solid var(--ink-3)}
.main{flex:1;min-width:0;max-width:920px}
.mobilebar{display:none}
.phead{background:var(--ink);color:var(--on-ink);padding:18px var(--pad) 16px}
.phead .kicker{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.phead h1{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:clamp(24px,6vw,32px);margin:2px 0 0;font-weight:700}
.phead .line{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:5px}
.phead .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ghostw{background:none;border:1px solid var(--ink-3);color:var(--on-ink);font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:8px 11px;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block}
.ghostw:hover{background:var(--ink-2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:14px var(--pad) 0;margin:0 calc(var(--pad) * -1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--ink-2);border:1px solid var(--ink-3);border-radius:2px;padding:7px 10px;min-width:120px}
.chip .nm{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:var(--mute)}
.chip .amt{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--on-ink)}
.chip.is-cash{border-color:var(--tick)}
.chip.is-cash .nm{color:var(--tick)}
.pane{padding:var(--pad) var(--pad) 96px}
h2.sec{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--dim);margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
h2.sec:first-child{margin-top:0}
button{font:inherit}
.btn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600;padding:11px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:none;color:var(--text)}
.btn.ghost:hover{background:var(--bar)}
.btn.tick{background:var(--tick);border-color:var(--tick-deep);color:var(--on-tick)}
.btn.tick:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 10px;font-size:11px}
.btn:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--rule);padding:20px;text-align:center;color:var(--dim);font-size:14px;border-radius:2px}
.empty b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--ink);margin-bottom:4px}
.bar-list{border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid rgba(0,0,0,.06)}
.bar-row:nth-child(odd){background:var(--bar)}
.bar-row:last-child{border-bottom:0}
.bar-row .who{font-weight:600;font-size:14px}
.bar-row .meta{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:1px;word-break:break-word}
.bar-row .amt{font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-row .kill{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:4px 2px}
.bar-row .kill:hover{color:var(--stamp)}
.bar-row.tap{cursor:pointer}
.bar-row.tap:hover{background:var(--hover)}
.trio{grid-template-columns:1fr auto auto}
.amt.in{color:var(--pos)}
.amt.out{color:var(--stamp)}
.pill{font-family:var(--mono);font-size:10px;border:1px solid var(--rule);border-radius:2px;padding:1px 5px;color:var(--dim);white-space:nowrap}
.pill.hot{border-color:var(--stamp);color:var(--stamp);font-weight:600}
.pill.warm{border-color:var(--tick-deep);color:var(--tick-deep)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tally div{border:1px solid var(--rule);border-radius:2px;padding:10px 12px;background:var(--card)}
.tally .lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim)}
.tally .val{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.tile{border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;text-decoration:none;color:inherit;display:block}
.tile:hover{background:var(--bar)}
.tile .cd{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.08em}
.tile .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .l{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim);margin-top:1px}
.tile.alert{border-color:var(--stamp)}
.tile.alert .v{color:var(--stamp)}
.sheet{border:1px solid var(--rule);border-radius:2px;background:var(--card);margin-bottom:16px}
.sheet .hd{background:var(--bar);border-bottom:1px solid var(--rule);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .hd .t{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.sheet .hd .c{font-family:var(--mono);font-size:10px;color:var(--dim)}
.sheet .bd{padding:4px 0}
.sheet .none{padding:14px 12px;color:var(--dim);font-size:13px}
.line-item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.055)}
.line-item:last-child{border-bottom:0}
.line-item .cd{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:1px 4px;margin-top:2px}
.line-item .tx{font-size:14px}
.line-item .tx small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:1px}
.line-item.late .cd{border-color:var(--stamp);color:var(--stamp)}
.line-item .go{background:none;border:0;color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:11px;padding:2px 4px;text-decoration:none}
.line-item .go:hover{color:var(--ink)}
.capture{display:flex;gap:6px;margin-bottom:6px}
.capture input{flex:1}
.capbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.task{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:start;padding:10px 11px;border-bottom:1px solid rgba(0,0,0,.06)}
.task:nth-child(odd){background:var(--bar)}
.task:last-child{border-bottom:0}
.box{width:19px;height:19px;border:2px solid var(--ink);border-radius:2px;background:var(--card);cursor:pointer;flex:0 0 auto;margin-top:1px;position:relative;padding:0}
.box:hover{background:var(--bar)}
.box[aria-pressed=true]{background:var(--ink)}
.box[aria-pressed=true]::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid var(--on-ink);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.task .ti{font-size:14.5px;font-weight:500}
.task.done .ti{text-decoration:line-through;color:var(--dim);font-weight:400}
.task .mt{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task .prio{width:3px;align-self:stretch;border-radius:2px;background:transparent}
.task.p1 .prio{background:var(--stamp)}
.task.p2 .prio{background:var(--tick)}
.grp{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.grp::-webkit-scrollbar{display:none}
.grp button{flex:0 0 auto;background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:7px 10px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--dim);cursor:pointer}
.grp button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhd .mo{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:15px;font-weight:700}
.calhd button{background:none;border:1px solid var(--rule);border-radius:2px;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-size:13px}
.calhd button:hover{background:var(--bar)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px}
.dow div{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;color:var(--dim);text-align:center;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.cell{background:var(--card);min-height:52px;padding:4px 3px 3px;cursor:pointer;border:0;text-align:left;font:inherit}
.cell:hover{background:var(--bar)}
.cell.out{background:#EDEFE9;color:#A6B0A2}
.cell .n{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--ink);color:var(--on-ink);border-radius:2px;padding:0 4px;font-weight:600}
.cell.sel{outline:2px solid var(--tick);outline-offset:-2px}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.dot.task{background:var(--tick-deep)}
.dot.due{background:var(--stamp)}
.dot.bday{background:var(--pos)}
.initial{width:34px;height:34px;flex:0 0 auto;background:var(--ink);color:var(--on-ink);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:15px}
.ctrow{grid-template-columns:auto 1fr auto auto}
.note{border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:2px;background:var(--card);padding:11px 12px;margin-bottom:9px;cursor:pointer}
.note:hover{background:var(--card2)}
.note.pin{border-left-color:var(--tick)}
.note .nt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:15px;font-weight:700}
.note .nb{font-size:13.5px;color:var(--dim);margin-top:3px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.note .nf{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.hb{border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:10px 12px;margin-bottom:8px}
.hb .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hb .nm{font-weight:600;font-size:14.5px}
.hb .st{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px}
.strip button{aspect-ratio:1;border:1px solid var(--rule);background:var(--bar);border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:9.5px;color:var(--dim);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.strip button[aria-pressed=true]{background:var(--pos);border-color:#1E4E36;color:#fff}
.strip button.tdy{outline:2px solid var(--ink);outline-offset:-2px}
.cat{margin-bottom:9px}
.cat .cl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;gap:8px}
.cat .cl span{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.cat .track{height:9px;background:var(--bar);border:1px solid var(--rule);border-radius:1px;overflow:hidden}
.cat .fill{height:100%;background:var(--stamp)}
.cat.income .fill{background:var(--pos)}
.ticket{position:relative;background:var(--tick);color:var(--on-tick);border-radius:3px;margin-bottom:12px;display:grid;grid-template-columns:1fr 100px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.ticket.owed-to-me{background:#CFE0C4;color:#1C2A16}
.ticket.dead{background:#DCD9CF;color:#6A665C}
.ticket .body{padding:12px 14px}
.ticket .kind{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:10px;opacity:.72}
.ticket .amt{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.05;margin:1px 0 2px;font-variant-numeric:tabular-nums}
.ticket .nm{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:15px;font-weight:600}
.ticket .note{font-size:12.5px;margin-top:4px;opacity:.8}
.ticket .via{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;margin-top:5px;opacity:.75}
.ticket .prog{margin-top:8px}
.ticket .prog .track{height:7px;background:rgba(0,0,0,.16);border-radius:1px;overflow:hidden}
.ticket .prog .fill{height:100%;background:rgba(0,0,0,.5)}
.ticket .prog .lbl{font-family:var(--mono);font-size:10.5px;margin-top:3px;opacity:.8}
.ticket .due{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;margin-top:6px}
.ticket .due.late{color:#7A1D10;font-weight:700}
.stub{border-left:2px dashed rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px;gap:6px}
.stub .code{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.04em;word-break:break-all}
.stub .date{font-family:var(--mono);font-size:9.5px;opacity:.7}
.notch{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--paper);right:94px}
.notch.t{top:-6px}
.notch.b{bottom:-6px}
.paid-stamp{position:absolute;left:12px;bottom:8px;transform:rotate(-9deg);border:2.5px solid var(--stamp);color:var(--stamp);border-radius:3px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;font-weight:700;font-size:15px;padding:2px 9px;opacity:.72}
.ticket-actions{display:flex;gap:6px;margin:-6px 0 16px;flex-wrap:wrap}
dialog{border:1px solid var(--ink);border-radius:3px;padding:0;width:min(480px,94vw);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(12,18,24,.55)}
.dlg-head{background:var(--ink);color:var(--on-ink);padding:12px 16px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-head button{background:none;border:0;color:var(--on-ink);font-size:20px;line-height:1;cursor:pointer}
.dlg-body{padding:16px;max-height:74vh;overflow:auto}
label{display:block;margin-bottom:11px}
label span{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim);margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--rule);border-radius:2px;background:var(--card);font-family:var(--body);font-size:16px;color:var(--text)}
input[type=date],input[type=time],input[type=number],input.code-in{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin-bottom:11px}
.seg button{flex:1;padding:11px 4px;background:var(--card);border:0;border-right:1px solid var(--rule);cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--dim)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.seg.mini{margin:0 0 10px}
.warn{background:var(--warm);border:1px solid var(--tick);padding:9px 11px;border-radius:2px;font-size:12.5px;margin:0 0 12px}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{width:auto;margin-top:3px}
.check span{letter-spacing:0;text-transform:none;font-size:13px;color:var(--text);font-family:var(--body);margin:0}
.foot-note{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:60;background:var(--ink);color:var(--on-ink);padding:9px 15px;border-radius:2px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;box-shadow:0 3px 14px rgba(12,18,24,.3);padding:14px 18px;border-radius:2px}
#printArea{display:none}
@media print{
  .shell,.fab,.toast,dialog{display:none!important}
  body{background:var(--card)}
  #printArea{display:block}
  .pv{border:2px solid #000;padding:18px 20px;margin-bottom:14px;page-break-inside:avoid}
  .pv .hd{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:11px;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:12px;display:flex;justify-content:space-between}
  .pv .big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1}

  H.trash=H.trash||[];
  H.trash.unshift({id:uid(),kind:kind,label:label||"(untitled)",data:data,when:Date.now()});
  var cut=Date.now()-30*86400000;
  H.trash=H.trash.filter(function(t){return t.when>cut;}).slice(0,300);
}
function untrash(entry){
  var d=entry.data;
  switch(entry.kind){
    case "task":    H.tasks.push(d); break;
    case "note":    H.notes.push(d); break;
    case "event":   H.events.push(d); break;
    case "contact": H.contacts.push(d); break;
    case "item":    H.things.push(d); break;
    case "habit":   H.habits.push(d); break;
    case "sub":     H.subs=H.subs||[]; H.subs.push(d); break;
    case "journal": H.journal=H.journal||[]; H.journal.push(d); break;
    case "piece":   H.scores=H.scores||[]; H.scores.push(d); break;
    default: return false;
  }
  H.trash=H.trash.filter(function(t){return t.id!==entry.id;});
  save(); return true;
}
function trashDialog(){
  openDlg("Trash",
    '<p class="foot-note" style="margin-top:0">Anything deleted in the last 30 days. Put it back or let it go.</p>'+
    '<div id="tzList"></div>',

      function fill(){
        var h=$("#tzList"); h.innerHTML="";
        var list=(H.trash||[]);
        if(!list.length){ h.appendChild(emptyBox("Empty","Nothing has been deleted lately.")); return; }
        var box=el("div","bar-list");

          r.appendChild(L);
          var b=el("button","btn ghost sm","Put back");
          b.onclick=function(){ if(untrash(t)){ toast("Restored"); fill(); } };
          r.appendChild(b);

          r.appendChild(k); box.appendChild(r);});
        h.appendChild(box);
      }
      fill();
    });
}

/* ---------- files & attachments (any module can use these) ---------- */
async function fileList(){
  try{ var r=await fetch("/api/files"); return r.ok?(await r.json()).files:[]; }
  catch(e){ return []; }
}
async function filesFor(kind,id){
  var all=await fileList();
  return all.filter(function(f){return f.linkKind===kind&&f.linkId===id;});
}
function b64h(s){ return btoa(unescape(encodeURIComponent(s||""))); }
async function fileUpload(file,kind,id,label){
  var r=await fetch("/api/files",{method:"POST",body:file,headers:{
    "Content-Type":file.type||"application/octet-stream",
    "X-Filename":b64h(file.name||"file"),
    "X-Link-Kind":kind||"","X-Link-Id":id||"","X-Label":b64h(label||"")}});
  if(!r.ok){ var e=await r.json().catch(function(){return{};});
    throw new Error(e.error||"upload failed"); }
  return r.json();
}
async function fileDelete(id){ await fetch("/api/files/"+id,{method:"DELETE"}); }
async function fileEdit(id,patch){
  await fetch("/api/files/"+id,{method:"PUT",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
}
function fileSize(n){
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(0)+" KB";
  return (n/1048576).toFixed(1)+" MB";
}
function isImage(f){ return /^image\//.test(f.type||""); }

/* Drop this into any dialog to give a record attachments:
   attachBar(hostElement, "ticket", t.code)                       */
function attachBar(host,kind,id,heading){
  var wrap=el("div"); wrap.style.marginBottom="11px";
  var h=el("div"); h.style.cssText="font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim);margin-bottom:4px";
  h.textContent=heading||"Attachments";
  wrap.appendChild(h);
  var list=el("div"); wrap.appendChild(list);
  var row=el("div","row-btns");
  var pick=el("input"); pick.type="file"; pick.style.display="none";
  pick.accept="image/*,application/pdf,.txt,.heic";
  var btn=el("button","btn ghost sm","Attach a file or photo");
  btn.onclick=function(e){ e.preventDefault(); pick.click(); };
  row.appendChild(btn); row.appendChild(pick); wrap.appendChild(row);
  host.appendChild(wrap);

  function draw(files){
    list.innerHTML="";
    if(!files.length){
      var n=el("div"); n.style.cssText="font-size:12px;color:var(--dim);margin-bottom:6px";
      n.textContent="Nothing attached yet.";
      list.appendChild(n); return;
    }
    var box=el("div","bar-list"); box.style.marginBottom="8px";
    files.forEach(function(f){
      var r=el("div","bar-row trio"),L=el("div");
      var a=el("a","who",f.label||f.name);
      a.href="/api/files/"+f.id; a.target="_blank";
      a.style.cssText="color:inherit;text-decoration:underline";
      L.appendChild(a);
      L.appendChild(el("div","meta",fileSize(f.size)+" · "+f.name));
      r.appendChild(L);
      r.appendChild(el("span","pill",isImage(f)?"image":(f.type||"").split("/")[1]||"file"));
      var k=el("button","kill","×");
      k.onclick=function(ev){ ev.preventDefault();
        if(!confirm("Remove "+(f.label||f.name)+"?")) return;
        fileDelete(f.id).then(load); };
      r.appendChild(k); box.appendChild(r);});
    list.appendChild(box);
  }
  function load(){ filesFor(kind,id).then(draw); }
  pick.onchange=function(){
    var f=pick.files[0]; if(!f) return;
    btn.disabled=true; btn.textContent="Uploading…";
    fileUpload(f,kind,id,"").then(function(){
      btn.disabled=false; btn.textContent="Attach a file or photo";
      pick.value=""; load(); toast("Attached");
    }).catch(function(e){
      btn.disabled=false; btn.textContent="Attach a file or photo";
      toast(e.message||"Upload failed");});
  };
  load();
  return wrap;
}

          if(!q||m[0].indexOf(q)>=0) out.push({cd:m[1],t:m[0],s:"create",go:m[2]});});
        // pages

        if(q&&q.length>=2){

              out.push({cd:"TK",t:t.title,s:t.done?"finished task":"open task",go:"tasks.html"});});
          (H.events||[]).forEach(function(e){
            if(e.title.toLowerCase().indexOf(q)>=0)
              out.push({cd:"CL",t:e.title,s:prettyFull(e.date),go:"calendar.html?d="+e.date});});
          allPeople().forEach(function(p){
            if(p.name.toLowerCase().indexOf(q)>=0)
              out.push({cd:"CT",t:p.name,s:p.how||"contact",go:"contacts.html?p="+p.id});});
          (H.notes||[]).forEach(function(n){
            if((n.title+" "+(n.body||"")).toLowerCase().indexOf(q)>=0)
              out.push({cd:"NT",t:n.title||"Untitled",s:"note",go:"notes.html?n="+n.id});});

              out.push({cd:"DC",t:p.title,s:"sheet music",go:"docs.html"});});

              out.push({cd:"SB",t:x.name,s:"subscription",go:"subs.html"});});
          if(L) (L.tickets||[]).forEach(function(t){
            if((t.name+" "+t.code).toLowerCase().indexOf(q)>=0)
              out.push({cd:"$$",t:(t.dir==="owe"?"You owe ":"Owed by ")+t.name,
                s:money(t.cents-(t.paidCents||0))+" · "+t.code,go:"money.html?t="+t.code});});
        }
        return out.slice(0,30);
      }
      function draw(){
        var q=$("#cq").value.trim().toLowerCase();
        rows=build(q); idx=0; box.innerHTML="";
        if(!rows.length){ box.appendChild(emptyBox("Nothing","Try fewer letters.")); return; }
        var b=el("div","bar-list");
        rows.forEach(function(r,i){
          var d=el("div","cmdrow"+(i===0?" sel":""));
          d.appendChild(el("div","cd",r.cd));
          var L2=el("div");
          L2.appendChild(el("div","t",r.t));
          L2.appendChild(el("div","s",r.s));
          d.appendChild(L2);
          d.appendChild(el("span","pill","open"));
          d.onclick=function(){ goPage(r.go); };
          b.appendChild(d);});
        box.appendChild(b);
      }
      $("#cq").oninput=draw;
      $("#cq").onkeydown=function(e){
        var els=box.querySelectorAll(".cmdrow");
        if(e.key==="ArrowDown"||e.key==="ArrowUp"){
          e.preventDefault();
          if(!els.length) return;
          els[idx].classList.remove("sel");
          idx=(idx+(e.key==="ArrowDown"?1:els.length-1))%els.length;
          els[idx].classList.add("sel");
          els[idx].scrollIntoView({block:"nearest"});
        } else if(e.key==="Enter"&&rows[idx]) goPage(rows[idx].go);
      };
      draw();
    });
}

function exportModule(kind){
  var cols,rows=[];
  var src={tasks:H.tasks,events:H.events,contacts:allPeople(),notes:H.notes,
    subs:H.subs,journal:H.journal,things:H.things,scores:H.scores}[kind]||[];
  if(!src.length) return toast("Nothing to export there");
  if(kind==="tasks") cols=["title","list","due","priority","repeat","done","finished","notes"];
  else if(kind==="events") cols=["title","date","time","end","place","people","notes"];
  else if(kind==="contacts") cols=["name","how","phone","email","address","birthday","tags","notes"];
  else if(kind==="notes") cols=["title","body","tags","pinned","updated"];
  else if(kind==="subs") cols=["name","amount","cycle","next","method","category","active","notes"];
  else if(kind==="journal") cols=["date","title","body","tags"];
  else if(kind==="things") cols=["item","direction","who","since","due","returned","notes"];
  else cols=["title","composer","arranger","grade","ensemble","tempo","key","length","folder","publisher","notes"];
  src.forEach(function(x){
    if(kind==="tasks") rows.push([x.title,x.list,x.due,x.prio,x.repeat,x.done?"yes":"no",x.doneOn||"",x.notes]);
    else if(kind==="events") rows.push([x.title,x.date,x.time,x.endTime,x.place,
      (x.personIds||[]).map(personName).join("; "),x.notes]);
    else if(kind==="contacts") rows.push([x.name,x.how,x.phone,x.email,x.addr,x.bday,
      (x.tags||[]).join("; "),x.notes]);
    else if(kind==="notes") rows.push([x.title,x.body,(x.tags||[]).join("; "),x.pinned?"yes":"no",x.updated]);
    else if(kind==="subs") rows.push([x.name,(x.cents/100).toFixed(2),x.cycle,x.next,x.method,x.cat,
      x.active===false?"cancelled":"active",x.notes]);
    else if(kind==="journal") rows.push([x.date,x.title,x.body,(x.tags||[]).join("; ")]);
    else if(kind==="things") rows.push([x.name,x.dir,personName(x.personId)||x.who,x.date,x.due,
      x.back?(x.backOn||"yes"):"no",x.notes]);
    else rows.push([x.title,x.composer,x.arranger,x.grade,x.ensemble,x.tempo,x.key,x.duration,
      x.folder,x.publisher,x.notes]);
  });
  var csv=[cols].concat(rows).map(function(r){
    return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  download(kind+"-"+today()+".csv",csv,"text/csv");
  toast(src.length+" rows exported");
}

/* ============================================================
   VAULT — AES-256-GCM, key derived with PBKDF2-SHA256.
   Only ciphertext is ever written to storage. The derived key
   lives in memory and dies when the page unloads or locks.
   There is no recovery: lose the master password, lose the data.
   ============================================================ */
var ITER=600000;
var KEY=null;         /* CryptoKey, memory only */
var ENTRIES=null;     /* decrypted entries, memory only */
var idleT=null, IDLE_MIN=5;
var HAVE_CRYPTO=!!(window.crypto&&window.crypto.subtle&&window.isSecureContext!==false);

function b64(buf){
  var b=new Uint8Array(buf),s="";
  for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  return btoa(s);
}
function unb64(str){
  var s=atob(str),b=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  return b;
}
function rand(n){return crypto.getRandomValues(new Uint8Array(n));}
async function deriveKey(pw,salt,iters){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:salt,iterations:iters,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function sealVault(){
  var iv=rand(12);
  var pt=new TextEncoder().encode(JSON.stringify(ENTRIES));
  var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},KEY,pt);
  V={version:1,salt:V.salt,iterations:V.iterations,iv:b64(iv),ct:b64(ct),updated:today()};
  await DB.set(VKEY,V);
}
async function openVault(pw){
  var salt=unb64(V.salt);
  var k=await deriveKey(pw,salt,V.iterations||ITER);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(V.iv)},k,unb64(V.ct));
  KEY=k; ENTRIES=JSON.parse(new TextDecoder().decode(pt));
}
function lock(){
  KEY=null; ENTRIES=null;
  clearTimeout(idleT);
  pageHead(); pageRender();
}
function touchIdle(){
  if(!KEY) return;
  clearTimeout(idleT);
  idleT=setTimeout(function(){ lock(); toast("Locked after "+IDLE_MIN+" minutes idle"); },IDLE_MIN*60000);
}

/* ---------- strength ---------- */
function bitsOf(pw){
  if(!pw) return 0;
  var n=0;
  if(/[a-z]/.test(pw)) n+=26;
  if(/[A-Z]/.test(pw)) n+=26;
  if(/[0-9]/.test(pw)) n+=10;
  if(/[^A-Za-z0-9]/.test(pw)) n+=33;
  if(!n) return 0;
  return Math.round(pw.length*Math.log(n)/Math.log(2));
}
function strengthLabel(b){
  if(b<40) return ["weak","" ];
  if(b<60) return ["okay","ok"];
  if(b<80) return ["strong","good"];
  return ["very strong","good"];
}
function meterFor(input,meter,label){
  function upd(){
    var b=bitsOf(input.value),s=strengthLabel(b);
    meter.className="meter "+s[1];
    meter.firstChild.style.width=Math.min(100,Math.round(b/100*100))+"%";
    label.textContent=input.value?(s[0]+" · about "+b+" bits"):"";
  }
  input.addEventListener("input",upd); upd();
}

/* ---------- generator ---------- */
/* lookalike-free sets: no l o L I O 0 1 */
var LOW="abcdefghijkmnpqrstuvwxyz", UPP="ABCDEFGHJKLMNPQRSTUVWXYZ",
    DIG="23456789", SYM="!@#$%^&*()-_=+[]{};:,.?";
function makePassword(len,opt){
  var pool="";
  if(opt.low) pool+=opt.amb?"abcdefghijklmnopqrstuvwxyz":LOW;
  if(opt.upp) pool+=opt.amb?"ABCDEFGHIJKLMNOPQRSTUVWXYZ":UPP;
  if(opt.dig) pool+=opt.amb?"0123456789":DIG;
  if(opt.sym) pool+=SYM;
  if(!pool) return "";
  var out="",r=crypto.getRandomValues(new Uint32Array(len));
  for(var i=0;i<len;i++) out+=pool[r[i]%pool.length];
  return out;
}
function copyNow(txt,label){
  function done(){
    toast((label||"Copied")+" — clipboard clears in 20s");
    setTimeout(function(){
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(" ").catch(function(){});
    },20000);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,function(){toast("Copy didn't work — reveal it and copy by hand");});
  else toast("Copy isn't available here — reveal it and copy by hand");
}

/* ---------- head + render ---------- */
function pageHead(){

function pageRender(){

function renderLock(){
  var box=$("#lockbox");
  if(!V){
    box.innerHTML=
      '<div class="lk">First run</div><h3>Set a master password</h3>'+
      '<p class="warn">This is the only key. Nobody can reset it — not this page, not a backup, not me. If you forget it the saved logins are gone for good. Write it down somewhere physical before you go further.</p>'+
      '<label><span>Master password</span><input type="password" id="m1" autocomplete="new-password"></label>'+
      '<div class="meter"><i></i></div><div class="mlbl" id="ml"></div>'+
      '<label style="margin-top:11px"><span>Type it again</span><input type="password" id="m2" autocomplete="new-password"></label>'+
      '<button class="btn tick" id="mGo" style="width:100%">Create the vault</button>';
    meterFor($("#m1"),box.querySelector(".meter"),$("#ml"));
    $("#mGo").onclick=async function(){
      var a=$("#m1").value,b=$("#m2").value;
      if(a.length<10){toast("Use at least 10 characters — a phrase works well");return;}
      if(a!==b){toast("The two don't match");return;}
      $("#mGo").disabled=true; $("#mGo").textContent="Working…";
      try{
        var salt=rand(16);
        KEY=await deriveKey(a,salt,ITER);
        ENTRIES=[];
        V={version:1,salt:b64(salt),iterations:ITER,iv:"",ct:"",updated:today()};
        await sealVault();
        touchIdle(); pageHead(); pageRender(); toast("Vault created");
      }catch(e){ $("#mGo").disabled=false; $("#mGo").textContent="Create the vault"; toast("Couldn't create the vault"); }
    };
    $("#lockNote").textContent="A passphrase of four or five unrelated words is easier to remember and harder to crack than a short scramble.";
    return;
  }
  box.innerHTML=
    '<div class="lk">Locked</div><h3>Enter your master password</h3>'+
    '<label><span>Master password</span><input type="password" id="mp" autocomplete="current-password"></label>'+
    '<button class="btn" id="mGo" style="width:100%">Unlock</button>';
  var go=async function(){
    var pw=$("#mp").value;
    if(!pw){toast("Type your master password");return;}
    $("#mGo").disabled=true; $("#mGo").textContent="Working…";
    try{
      await openVault(pw);
      touchIdle(); pageHead(); pageRender();
    }catch(e){
      $("#mGo").disabled=false; $("#mGo").textContent="Unlock";
      $("#mp").value=""; $("#mp").focus();
      toast("That password didn't open it");
    }
  };
  $("#mGo").onclick=go;
  $("#mp").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
  setTimeout(function(){$("#mp").focus();},40);
  $("#lockNote").textContent="Unlocking takes a second on purpose — the key is stretched 600,000 rounds so a stolen copy of this file is expensive to attack.";
}

function dupSet(){
  var seen={},dup={};
  ENTRIES.forEach(function(e){
    if(!e.pass) return;
    if(seen[e.pass]) dup[e.pass]=1; else seen[e.pass]=1;});
  return dup;
}
function renderAudit(){
  var dup=dupSet();
  var weak=ENTRIES.filter(function(e){return e.pass&&bitsOf(e.pass)<40;}).length;
  var reused=ENTRIES.filter(function(e){return e.pass&&dup[e.pass];}).length;
  var stale=ENTRIES.filter(function(e){return e.updated&&daysBetween(e.updated,today())>365;}).length;
  var a=$("#audit"); a.innerHTML="";
  [[weak,"weak"],[reused,"reused"],[stale,"over a year old"]].forEach(function(x){
    var d=el("div",x[0]?"bad":"");
    d.appendChild(el("div","n",String(x[0])));
    d.appendChild(el("div","t",x[1]));
    a.appendChild(d);});
}
function renderList(){
  var q=($("#q").value||"").trim().toLowerCase();
  var dup=dupSet();
  var list=ENTRIES.filter(function(e){
    if(!q) return true;
    return [e.title,e.user,e.url,e.note,(e.tags||[]).join(" ")].join(" ").toLowerCase().indexOf(q)>=0;})
    .slice().sort(function(a,b){return (a.title||"").localeCompare(b.title||"");});
  var host=$("#list"); host.innerHTML="";
  if(!list.length){
    host.appendChild(emptyBox(q?"No matches":"Vault is empty",
      q?"Try part of the site name.":"Add your first login. Use the generator so it starts strong."));
    return;}
  list.forEach(function(e){
    var b=bitsOf(e.pass),isDup=e.pass&&dup[e.pass];
    var d=el("div","cred"+(b<40?" weak":isDup?" reused":""));
    d.appendChild(el("div","ct",e.title||"Untitled"));
    if(e.user) d.appendChild(el("div","cu",e.user));
    var f=el("div","cf");
    var s=strengthLabel(b);
    f.appendChild(el("span","pill"+(b<40?" hot":""),s[0]));
    if(isDup) f.appendChild(el("span","pill warm","reused"));
    (e.tags||[]).forEach(function(t){f.appendChild(el("span","pill",t));});
    var cp=el("button","btn ghost sm","Copy password");
    cp.onclick=function(ev){ev.stopPropagation();touchIdle();copyNow(e.pass,"Password copied");};
    f.appendChild(cp);
    if(e.user){
      var cu=el("button","btn ghost sm","Copy user");
      cu.onclick=function(ev){ev.stopPropagation();touchIdle();copyNow(e.user,"Username copied");};
      f.appendChild(cu);
    }
    d.appendChild(f);
    d.onclick=function(){credDialog(e);};
    host.appendChild(d);});
}

/* ---------- dialogs ---------- */
function credDialog(e){
  var isNew=!e;
  e=e||{title:"",user:"",pass:"",url:"",note:"",tags:[]};
  openDlg(isNew?"Add a login":(e.title||"Login"),

      '<button class="btn ghost sm" id="fShow">Reveal</button>'+
      '<button class="btn ghost sm" id="fGen">Generate one</button>'+
      (isNew?'':'<button class="btn ghost sm" id="fCopy">Copy</button>')+'</div>'+
    '<label><span>Web address</span><input id="fW" value="'+esc(e.url||"")+'" placeholder="Optional"></label>'+
    '<label><span>Tags</span><input id="fG" value="'+esc((e.tags||[]).join(", "))+'" placeholder="banking, email, shopping"></label>'+

    function(){

        setTimeout(function(){ genDialog(function(pw){ e.pass=pw; credDialog(isNew?null:e); if(isNew){ setTimeout(function(){ $("#fP").value=pw; $("#fP").dispatchEvent(new Event("input")); },80);} }); },60);};
      if(!isNew) $("#fCopy").onclick=function(){touchIdle();copyNow(pi.value,"Password copied");};

        var t=$("#fT").value.trim();

        e.note=$("#fN").value; e.updated=today();
        e.tags=$("#fG").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
        var np=pi.value;
        if(np!==e.pass){ e.pass=np; e.changed=today(); }
        if(isNew){ e.id=uid(); e.created=today(); e.changed=today(); ENTRIES.push(e); }
        await sealVault(); touchIdle(); pageHead(); pageRender(); dlg.close();
        toast(isNew?"Saved to the vault":"Saved");};
      if(!isNew) $("#fX").onclick=async function(){
        if(!confirm("Delete the login for "+(e.title||"this site")+"? It cannot be recovered.")) return;
        ENTRIES=ENTRIES.filter(function(x){return x.id!==e.id;});
        await sealVault(); pageHead(); pageRender(); dlg.close(); toast("Deleted");};
    });
}

function genDialog(onUse){
  openDlg("Generate a password",
    '<div class="genout" id="gOut">—</div>'+
    '<div class="slider"><input type="range" id="gLen" min="8" max="64" value="20"><span class="v" id="gLenV">20</span></div>'+
    '<div class="mlbl" id="gBits" style="margin-bottom:11px"></div>'+
    '<div class="togs">'+
      '<label><input type="checkbox" id="gL" checked><span>a–z</span></label>'+
      '<label><input type="checkbox" id="gU" checked><span>A–Z</span></label>'+
      '<label><input type="checkbox" id="gD" checked><span>0–9</span></label>'+
      '<label><input type="checkbox" id="gS" checked><span>symbols</span></label>'+
      '<label style="grid-column:1/-1"><input type="checkbox" id="gA"><span>allow lookalikes (l 1 I O 0)</span></label>'+
    '</div>'+
    '<div class="row-btns">'+
      '<button class="btn ghost" id="gAgain" style="flex:1">Roll again</button>'+
      '<button class="btn ghost" id="gCopy">Copy</button>'+
      (onUse?'<button class="btn tick" id="gUse">Use it</button>':'')+
    '</div>'+
    '<p class="foot-note">Random characters come from the browser\'s cryptographic generator, not Math.random.</p>',
    function(){
      function roll(){
        var len=+$("#gLen").value;
        var pw=makePassword(len,{low:$("#gL").checked,upp:$("#gU").checked,
          dig:$("#gD").checked,sym:$("#gS").checked,amb:$("#gA").checked});
        if(!pw){ $("#gOut").textContent="pick at least one kind of character"; $("#gBits").textContent=""; return; }
        $("#gOut").textContent=pw;
        $("#gLenV").textContent=len;
        var b=bitsOf(pw);
        $("#gBits").textContent=strengthLabel(b)[0]+" · about "+b+" bits of entropy";
      }
      ["gLen","gL","gU","gD","gS","gA"].forEach(function(id){ $("#"+id).oninput=roll; });
      $("#gAgain").onclick=roll;
      $("#gCopy").onclick=function(){touchIdle();copyNow($("#gOut").textContent,"Password copied");};
      if(onUse) $("#gUse").onclick=function(){ var pw=$("#gOut").textContent; dlg.close(); onUse(pw); };
      roll();
    });
}

function masterDialog(){
  openDlg("Change master password",
    '<p class="warn">Everything gets re-encrypted with the new one. Old backups still need the old password.</p>'+
    '<label><span>Current master password</span><input type="password" id="c0" autocomplete="current-password"></label>'+
    '<label><span>New master password</span><input type="password" id="c1" autocomplete="new-password"></label>'+
    '<div class="meter"><i></i></div><div class="mlbl" id="ml"></div>'+
    '<label style="margin-top:11px"><span>Type the new one again</span><input type="password" id="c2" autocomplete="new-password"></label>'+
    '<button class="btn" id="cGo" style="width:100%">Change it</button>',
    function(){
      meterFor($("#c1"),$("#dlgBody").querySelector(".meter"),$("#ml"));
      $("#cGo").onclick=async function(){
        var cur=$("#c0").value,a=$("#c1").value,b=$("#c2").value;
        if(a.length<10){toast("Use at least 10 characters");return;}
        if(a!==b){toast("The two new ones don't match");return;}
        $("#cGo").disabled=true; $("#cGo").textContent="Working…";
        try{
          await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(V.iv)},
            await deriveKey(cur,unb64(V.salt),V.iterations||ITER),unb64(V.ct));
        }catch(e){
          $("#cGo").disabled=false; $("#cGo").textContent="Change it";
          toast("The current password is wrong"); return;}
        var salt=rand(16);
        KEY=await deriveKey(a,salt,ITER);
        V.salt=b64(salt); V.iterations=ITER;
        await sealVault(); touchIdle(); dlg.close(); toast("Master password changed");
      };
    });
}

function pageAction(a){
  if(a==="new") credDialog(null);
  else if(a==="gen") genDialog(null);
  else if(a==="lock"){ lock(); toast("Locked"); }
  else if(a==="master") masterDialog();
}
function pageBoot(){
  $("#q").oninput=function(){touchIdle();renderList();};
  ["click","keydown"].forEach(function(ev){
    document.addEventListener(ev,touchIdle,true);});
  window.addEventListener("pagehide",lock);
}
})();
