<title>Talk — Station</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202A; --ink-2:#22303D; --ink-3:#35485A; --paper:#F3F5EF; --bar:#DDE9D4;
  --rule:#C3CDBB; --stamp:#B0402E; --tick:#E3A62C; --tick-deep:#8A6414;
  --pos:#2C6B4C; --dim:#6B7A6B; --mute:#8FA3A8; --pad:16px;
  --disp:"Archivo Narrow",Helvetica Neue,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme=dark]{
  --paper:#141A20; --card:#1B232B; --card2:#202931; --hover:#26313A;
  --text:#E3E8DF; --bar:#1F2932; --rule:#35424C; --dim:#94A296; --mute:#8FA3A8;
  --ink:#0D1318; --ink-2:#18212A; --ink-3:#35424C;
  --stamp:#D9705C; --pos:#63B08A; --tick:#E3A62C; --tick-deep:#C79433;
  --warm:#3A3020; --bad:#3A2320; --on-tick:#2A1F05;
}
[data-theme=dark] .empty b{color:var(--text)}
[data-theme=dark] .warn{color:#F0DCB4}
[data-theme=dark] .offline{color:#F2C9C0}
[data-theme=dark] .ticket,[data-theme=dark] .ticket.owed-to-me{color:#1C2A16}
[data-theme=dark] .genout{background:#000;color:#DFF0DA}
[data-theme=dark] img,[data-theme=dark] .doc .thumb img{filter:brightness(.92)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.shell{display:flex;min-height:100vh}
.rail{width:196px;flex:0 0 196px;background:var(--ink);color:var(--on-ink);padding:16px 0 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 16px 14px;border-bottom:1px solid var(--ink-3);margin-bottom:10px;text-decoration:none;display:block;color:inherit}
.brand .mk{font-family:var(--disp);text-transform:uppercase;letter-spacing:.24em;font-size:13px;font-weight:700}
.brand .sub{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:3px}
.rail a.nv{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--mute);text-decoration:none;border-left:3px solid transparent}
.rail a.nv .cd{font-family:var(--mono);font-size:10px;font-weight:600;border:1px solid var(--ink-3);border-radius:2px;padding:2px 4px;min-width:26px;text-align:center;letter-spacing:.05em}
.rail a.nv .lb{font-family:var(--disp);text-transform:uppercase;letter-spacing:.11em;font-size:12px}
.rail a.nv .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tick)}
.rail a.nv:hover{color:var(--on-ink);background:var(--ink-2)}
.rail a.nv[aria-current=page]{color:var(--on-ink);border-left-color:var(--tick);background:var(--ink-2)}
.rail a.nv[aria-current=page] .cd{border-color:var(--tick);color:var(--tick)}
.railfoot{padding:14px 16px 0;margin-top:12px;border-top:1px solid var(--ink-3)}
.main{flex:1;min-width:0;max-width:920px}
.mobilebar{display:none}
.phead{background:var(--ink);color:var(--on-ink);padding:18px var(--pad) 16px}
.phead .kicker{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.phead h1{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-size:clamp(24px,6vw,32px);margin:2px 0 0;font-weight:700}
.phead .line{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:5px}
.phead .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ghostw{background:none;border:1px solid var(--ink-3);color:var(--on-ink);font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:8px 11px;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block}
.ghostw:hover{background:var(--ink-2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:14px var(--pad) 0;margin:0 calc(var(--pad) * -1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--ink-2);border:1px solid var(--ink-3);border-radius:2px;padding:7px 10px;min-width:120px}
.chip .nm{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:var(--mute)}
.chip .amt{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--on-ink)}
.chip.is-cash{border-color:var(--tick)}
.chip.is-cash .nm{color:var(--tick)}
.pane{padding:var(--pad) var(--pad) 96px}
h2.sec{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--dim);margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
h2.sec:first-child{margin-top:0}
button{font:inherit}
.btn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600;padding:11px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:none;color:var(--text)}
.btn.ghost:hover{background:var(--bar)}
.btn.tick{background:var(--tick);border-color:var(--tick-deep);color:var(--on-tick)}
.btn.tick:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 10px;font-size:11px}
.btn:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--rule);padding:20px;text-align:center;color:var(--dim);font-size:14px;border-radius:2px}
.empty b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--ink);margin-bottom:4px}
.bar-list{border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid rgba(0,0,0,.06)}
.bar-row:nth-child(odd){background:var(--bar)}
.bar-row:last-child{border-bottom:0}
.bar-row .who{font-weight:600;font-size:14px}
.bar-row .meta{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:1px;word-break:break-word}
.bar-row .amt{font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-row .kill{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:4px 2px}
.bar-row .kill:hover{color:var(--stamp)}
.bar-row.tap{cursor:pointer}
.bar-row.tap:hover{background:var(--hover)}
.trio{grid-template-columns:1fr auto auto}
.amt.in{color:var(--pos)}
.amt.out{color:var(--stamp)}
.pill{font-family:var(--mono);font-size:10px;border:1px solid var(--rule);border-radius:2px;padding:1px 5px;color:var(--dim);white-space:nowrap}
.pill.hot{border-color:var(--stamp);color:var(--stamp);font-weight:600}
.pill.warm{border-color:var(--tick-deep);color:var(--tick-deep)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tally div{border:1px solid var(--rule);border-radius:2px;padding:10px 12px;background:var(--card)}
.tally .lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim)}
.tally .val{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.tile{border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;text-decoration:none;color:inherit;display:block}
.tile:hover{background:var(--bar)}
.tile .cd{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.08em}
.tile .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .l{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim);margin-top:1px}
.tile.alert{border-color:var(--stamp)}
.tile.alert .v{color:var(--stamp)}
.sheet{border:1px solid var(--rule);border-radius:2px;background:var(--card);margin-bottom:16px}
.sheet .hd{background:var(--bar);border-bottom:1px solid var(--rule);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .hd .t{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.sheet .hd .c{font-family:var(--mono);font-size:10px;color:var(--dim)}
.sheet .bd{padding:4px 0}
.sheet .none{padding:14px 12px;color:var(--dim);font-size:13px}
.line-item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.055)}
.line-item:last-child{border-bottom:0}
.line-item .cd{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:1px 4px;margin-top:2px}
.line-item .tx{font-size:14px}
.line-item .tx small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:1px}
.line-item.late .cd{border-color:var(--stamp);color:var(--stamp)}
.line-item .go{background:none;border:0;color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:11px;padding:2px 4px;text-decoration:none}
.line-item .go:hover{color:var(--ink)}
.capture{display:flex;gap:6px;margin-bottom:6px}
.capture input{flex:1}
.capbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.task{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:start;padding:10px 11px;border-bottom:1px solid rgba(0,0,0,.06)}
.task:nth-child(odd){background:var(--bar)}
.task:last-child{border-bottom:0}
.box{width:19px;height:19px;border:2px solid var(--ink);border-radius:2px;background:var(--card);cursor:pointer;flex:0 0 auto;margin-top:1px;position:relative;padding:0}
.box:hover{background:var(--bar)}
.box[aria-pressed=true]{background:var(--ink)}
.box[aria-pressed=true]::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid var(--on-ink);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.task .ti{font-size:14.5px;font-weight:500}
.task.done .ti{text-decoration:line-through;color:var(--dim);font-weight:400}
.task .mt{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task .prio{width:3px;align-self:stretch;border-radius:2px;background:transparent}
.task.p1 .prio{background:var(--stamp)}
.task.p2 .prio{background:var(--tick)}
.grp{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.grp::-webkit-scrollbar{display:none}
.grp button{flex:0 0 auto;background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:7px 10px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--dim);cursor:pointer}
.grp button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhd .mo{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:15px;font-weight:700}
.calhd button{background:none;border:1px solid var(--rule);border-radius:2px;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-size:13px}
.calhd button:hover{background:var(--bar)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px}
.dow div{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;color:var(--dim);text-align:center;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.cell{background:var(--card);min-height:52px;padding:4px 3px 3px;cursor:pointer;border:0;text-align:left;font:inherit}
.cell:hover{background:var(--bar)}
.cell.out{background:#EDEFE9;color:#A6B0A2}
.cell .n{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--ink);color:var(--on-ink);border-radius:2px;padding:0 4px;font-weight:600}
.cell.sel{outline:2px solid var(--tick);outline-offset:-2px}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.dot.task{background:var(--tick-deep)}
.dot.due{background:var(--stamp)}
.dot.bday{background:var(--pos)}
.initial{width:34px;height:34px;flex:0 0 auto;background:var(--ink);color:var(--on-ink);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:15px}
.ctrow{grid-template-columns:auto 1fr auto auto}
.note{border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:2px;background:var(--card);padding:11px 12px;margin-bottom:9px;cursor:pointer}
.note:hover{background:var(--card2)}
.note.pin{border-left-color:var(--tick)}
.note .nt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:15px;font-weight:700}
.note .nb{font-size:13.5px;color:var(--dim);margin-top:3px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.note .nf{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.hb{border:1px solid var(--rule);background:var(--card);border-radius:2px;padding:10px 12px;margin-bottom:8px}
.hb .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hb .nm{font-weight:600;font-size:14.5px}
.hb .st{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px}
.strip button{aspect-ratio:1;border:1px solid var(--rule);background:var(--bar);border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:9.5px;color:var(--dim);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.strip button[aria-pressed=true]{background:var(--pos);border-color:#1E4E36;color:#fff}
.strip button.tdy{outline:2px solid var(--ink);outline-offset:-2px}
.cat{margin-bottom:9px}
.cat .cl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;gap:8px}
.cat .cl span{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.cat .track{height:9px;background:var(--bar);border:1px solid var(--rule);border-radius:1px;overflow:hidden}
.cat .fill{height:100%;background:var(--stamp)}
.cat.income .fill{background:var(--pos)}
.ticket{position:relative;background:var(--tick);color:var(--on-tick);border-radius:3px;margin-bottom:12px;display:grid;grid-template-columns:1fr 100px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.ticket.owed-to-me{background:#CFE0C4;color:#1C2A16}
.ticket.dead{background:#DCD9CF;color:#6A665C}
.ticket .body{padding:12px 14px}
.ticket .kind{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:10px;opacity:.72}
.ticket .amt{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.05;margin:1px 0 2px;font-variant-numeric:tabular-nums}
.ticket .nm{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:15px;font-weight:600}
.ticket .note{font-size:12.5px;margin-top:4px;opacity:.8}
.ticket .via{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;margin-top:5px;opacity:.75}
.ticket .prog{margin-top:8px}
.ticket .prog .track{height:7px;background:rgba(0,0,0,.16);border-radius:1px;overflow:hidden}
.ticket .prog .fill{height:100%;background:rgba(0,0,0,.5)}
.ticket .prog .lbl{font-family:var(--mono);font-size:10.5px;margin-top:3px;opacity:.8}
.ticket .due{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;margin-top:6px}
.ticket .due.late{color:#7A1D10;font-weight:700}
.stub{border-left:2px dashed rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px;gap:6px}
.stub .code{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.04em;word-break:break-all}
.stub .date{font-family:var(--mono);font-size:9.5px;opacity:.7}
.notch{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--paper);right:94px}
.notch.t{top:-6px}
.notch.b{bottom:-6px}
.paid-stamp{position:absolute;left:12px;bottom:8px;transform:rotate(-9deg);border:2.5px solid var(--stamp);color:var(--stamp);border-radius:3px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;font-weight:700;font-size:15px;padding:2px 9px;opacity:.72}
.ticket-actions{display:flex;gap:6px;margin:-6px 0 16px;flex-wrap:wrap}
dialog{border:1px solid var(--ink);border-radius:3px;padding:0;width:min(480px,94vw);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(12,18,24,.55)}
.dlg-head{background:var(--ink);color:var(--on-ink);padding:12px 16px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-head button{background:none;border:0;color:var(--on-ink);font-size:20px;line-height:1;cursor:pointer}
.dlg-body{padding:16px;max-height:74vh;overflow:auto}
label{display:block;margin-bottom:11px}
label span{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim);margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--rule);border-radius:2px;background:var(--card);font-family:var(--body);font-size:16px;color:var(--text)}
input[type=date],input[type=time],input[type=number],input.code-in{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin-bottom:11px}
.seg button{flex:1;padding:11px 4px;background:var(--card);border:0;border-right:1px solid var(--rule);cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--dim)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.seg.mini{margin:0 0 10px}
.warn{background:var(--warm);border:1px solid var(--tick);padding:9px 11px;border-radius:2px;font-size:12.5px;margin:0 0 12px}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{width:auto;margin-top:3px}
.check span{letter-spacing:0;text-transform:none;font-size:13px;color:var(--text);font-family:var(--body);margin:0}
.foot-note{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:60;background:var(--ink);color:var(--on-ink);padding:9px 15px;border-radius:2px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;box-shadow:0 3px 14px rgba(12,18,24,.3);padding:14px 18px;border-radius:2px}
#printArea{display:none}
@media print{
  .shell,.fab,.toast,dialog{display:none!important}
  body{background:var(--card)}
  #printArea{display:block}
  .pv{border:2px solid #000;padding:18px 20px;margin-bottom:14px;page-break-inside:avoid}
  .pv .hd{font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:11px;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:12px;display:flex;justify-content:space-between}
  .pv .big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1}

/* ---------- people (shared by every module) ---------- */
function allPeople(){
  var out=[],seen={};
  (H.contacts||[]).forEach(function(c){seen[c.id]=1;out.push(c);});
  if(L&&L.people) L.people.forEach(function(p){
    if(!seen[p.id]){seen[p.id]=1;out.push({id:p.id,name:p.name,fromLedger:true});}});
  out.sort(function(a,b){return a.name.localeCompare(b.name);});
  return out;
}
function contactRec(id){
  var c=(H.contacts||[]).filter(function(x){return x.id===id;})[0];
  if(c) return c;
  if(L&&L.people){var p=L.people.filter(function(x){return x.id===id;})[0];
    if(p) return {id:p.id,name:p.name,fromLedger:true};}
  return null;
}
function personName(id){return (contactRec(id)||{}).name||"";}
function ensureContact(name){
  name=(name||"").trim(); if(!name) return null;
  var hit=allPeople().filter(function(p){return p.name.toLowerCase()===name.toLowerCase();})[0];
  if(hit){
    if(!(H.contacts||[]).some(function(c){return c.id===hit.id;})) H.contacts.push({id:hit.id,name:hit.name});
    return contactRec(hit.id);
  }
  var c={id:uid(),name:name};
  H.contacts.push(c);
  if(L){L.people.push({id:c.id,name:c.name});saveL();}
  save();
  return c;
}
function moneyWith(id){
  if(!L) return null;
  var gave=0,got=0,owe=0,owed=0,last=null;
  L.txns.forEach(function(t){ if(t.personId!==id) return;
    if(t.type==="in")gave+=t.cents; if(t.type==="out")got+=t.cents;
    if(!last||t.date>last)last=t.date; });
  L.tickets.forEach(function(t){ if(t.personId!==id||t.status!=="open") return;
    var rem=t.cents-(t.paidCents||0);
    if(t.dir==="owe")owe+=rem; else owed+=rem; });
  return {gave:gave,got:got,owe:owe,owed:owed,net:owed-owe,last:last};
}
function ledgerTotals(){
  if(!L) return null;
  var total=L.accounts.reduce(function(s,a){return s+a.cents;},0);
  var cash=L.accounts.filter(function(a){return a.kind==="cash";}).reduce(function(s,a){return s+a.cents;},0);
  var owe=0,owed=0,late=[];
  L.tickets.forEach(function(t){ if(t.status!=="open") return;
    var rem=t.cents-(t.paidCents||0);
    if(t.dir==="owe")owe+=rem; else owed+=rem;
    if(t.due&&t.due<=today()) late.push(t); });
  return {total:total,cash:cash,owe:owe,owed:owed,late:late};
}
function remaining(t){return t.cents-(t.paidCents||0);}

/* ---------- trash: nothing is really deleted for 30 days ---------- */
function trashIt(kind,label,data){
  H.trash=H.trash||[];
  H.trash.unshift({id:uid(),kind:kind,label:label||"(untitled)",data:data,when:Date.now()});
  var cut=Date.now()-30*86400000;
  H.trash=H.trash.filter(function(t){return t.when>cut;}).slice(0,300);
}
function untrash(entry){
  var d=entry.data;
  switch(entry.kind){
    case "task":    H.tasks.push(d); break;
    case "note":    H.notes.push(d); break;
    case "event":   H.events.push(d); break;
    case "contact": H.contacts.push(d); break;
    case "item":    H.things.push(d); break;
    case "habit":   H.habits.push(d); break;
    case "sub":     H.subs=H.subs||[]; H.subs.push(d); break;
    case "journal": H.journal=H.journal||[]; H.journal.push(d); break;
    case "piece":   H.scores=H.scores||[]; H.scores.push(d); break;
    default: return false;
  }
  H.trash=H.trash.filter(function(t){return t.id!==entry.id;});
  save(); return true;
}
function trashDialog(){
  openDlg("Trash",
    '<p class="foot-note" style="margin-top:0">Anything deleted in the last 30 days. Put it back or let it go.</p>'+
    '<div id="tzList"></div>',
    function(){
      function fill(){
        var h=$("#tzList"); h.innerHTML="";
        var list=(H.trash||[]);
        if(!list.length){ h.appendChild(emptyBox("Empty","Nothing has been deleted lately.")); return; }
        var box=el("div","bar-list");
        list.forEach(function(t){
          var r=el("div","bar-row trio"),L=el("div");
          L.appendChild(el("div","who",t.label));
          var days=Math.max(0,30-Math.floor((Date.now()-t.when)/86400000));
          L.appendChild(el("div","meta",t.kind+" · gone for good in "+days+" day"+(days===1?"":"s")));
          r.appendChild(L);
          var b=el("button","btn ghost sm","Put back");
          b.onclick=function(){ if(untrash(t)){ toast("Restored"); fill(); } };
          r.appendChild(b);
          var k=el("button","kill","×");
          k.onclick=function(){ H.trash=H.trash.filter(function(x){return x.id!==t.id;}); save(); fill(); };
          r.appendChild(k); box.appendChild(r);});
        h.appendChild(box);
      }
      fill();
    });
}

/* ---------- files & attachments (any module can use these) ---------- */
async function fileList(){
  try{ var r=await fetch("/api/files"); return r.ok?(await r.json()).files:[]; }
  catch(e){ return []; }
}
async function filesFor(kind,id){
  var all=await fileList();
  return all.filter(function(f){return f.linkKind===kind&&f.linkId===id;});
}
function b64h(s){ return btoa(unescape(encodeURIComponent(s||""))); }
async function fileUpload(file,kind,id,label){
  var r=await fetch("/api/files",{method:"POST",body:file,headers:{
    "Content-Type":file.type||"application/octet-stream",
    "X-Filename":b64h(file.name||"file"),
    "X-Link-Kind":kind||"","X-Link-Id":id||"","X-Label":b64h(label||"")}});
  if(!r.ok){ var e=await r.json().catch(function(){return{};});
    throw new Error(e.error||"upload failed"); }
  return r.json();
}
async function fileDelete(id){ await fetch("/api/files/"+id,{method:"DELETE"}); }
async function fileEdit(id,patch){
  await fetch("/api/files/"+id,{method:"PUT",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});
}
function fileSize(n){
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(0)+" KB";
  return (n/1048576).toFixed(1)+" MB";
}
function isImage(f){ return /^image\//.test(f.type||""); }

/* Drop this into any dialog to give a record attachments:
   attachBar(hostElement, "ticket", t.code)                       */
function attachBar(host,kind,id,heading){
  var wrap=el("div"); wrap.style.marginBottom="11px";
  var h=el("div"); h.style.cssText="font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim);margin-bottom:4px";
  h.textContent=heading||"Attachments";
  wrap.appendChild(h);
  var list=el("div"); wrap.appendChild(list);
  var row=el("div","row-btns");
  var pick=el("input"); pick.type="file"; pick.style.display="none";
  pick.accept="image/*,application/pdf,.txt,.heic";
  var btn=el("button","btn ghost sm","Attach a file or photo");
  btn.onclick=function(e){ e.preventDefault(); pick.click(); };
  row.appendChild(btn); row.appendChild(pick); wrap.appendChild(row);
  host.appendChild(wrap);

  function draw(files){
    list.innerHTML="";
    if(!files.length){
      var n=el("div"); n.style.cssText="font-size:12px;color:var(--dim);margin-bottom:6px";
      n.textContent="Nothing attached yet.";
      list.appendChild(n); return;
    }
    var box=el("div","bar-list"); box.style.marginBottom="8px";
    files.forEach(function(f){
      var r=el("div","bar-row trio"),L=el("div");
      var a=el("a","who",f.label||f.name);
      a.href="/api/files/"+f.id; a.target="_blank";
      a.style.cssText="color:inherit;text-decoration:underline";
      L.appendChild(a);
      L.appendChild(el("div","meta",fileSize(f.size)+" · "+f.name));
      r.appendChild(L);
      r.appendChild(el("span","pill",isImage(f)?"image":(f.type||"").split("/")[1]||"file"));
      var k=el("button","kill","×");
      k.onclick=function(ev){ ev.preventDefault();
        if(!confirm("Remove "+(f.label||f.name)+"?")) return;
        fileDelete(f.id).then(load); };
      r.appendChild(k); box.appendChild(r);});
    list.appendChild(box);
  }
  function load(){ filesFor(kind,id).then(draw); }
  pick.onchange=function(){
    var f=pick.files[0]; if(!f) return;
    btn.disabled=true; btn.textContent="Uploading…";
    fileUpload(f,kind,id,"").then(function(){
      btn.disabled=false; btn.textContent="Attach a file or photo";
      pick.value=""; load(); toast("Attached");
    }).catch(function(e){
      btn.disabled=false; btn.textContent="Attach a file or photo";
      toast(e.message||"Upload failed");});
  };
  load();
  return wrap;
}

function exportModule(kind){
  var cols,rows=[];
  var src={tasks:H.tasks,events:H.events,contacts:allPeople(),notes:H.notes,
    subs:H.subs,journal:H.journal,things:H.things,scores:H.scores,invoices:H.invoices}[kind]||[];
  if(!src.length) return toast("Nothing to export there");
  if(kind==="tasks") cols=["title","list","due","priority","repeat","done","finished","notes"];
  else if(kind==="events") cols=["title","date","time","end","place","people","notes"];
  else if(kind==="contacts") cols=["name","how","phone","email","address","birthday","tags","notes"];
  else if(kind==="notes") cols=["title","body","tags","pinned","updated"];
  else if(kind==="subs") cols=["name","amount","cycle","next","method","category","active","notes"];
  else if(kind==="journal") cols=["date","title","body","tags"];
  else if(kind==="things") cols=["item","direction","who","since","due","returned","notes"];
  else if(kind==="invoices") cols=["number","billed to","for","issued","due","status","paid on","total"];
  else cols=["title","composer","arranger","grade","ensemble","tempo","key","length","folder","publisher","notes"];
  src.forEach(function(x){
    if(kind==="tasks") rows.push([x.title,x.list,x.due,x.prio,x.repeat,x.done?"yes":"no",x.doneOn||"",x.notes]);
    else if(kind==="events") rows.push([x.title,x.date,x.time,x.endTime,x.place,
      (x.personIds||[]).map(personName).join("; "),x.notes]);
    else if(kind==="contacts") rows.push([x.name,x.how,x.phone,x.email,x.addr,x.bday,
      (x.tags||[]).join("; "),x.notes]);
    else if(kind==="notes") rows.push([x.title,x.body,(x.tags||[]).join("; "),x.pinned?"yes":"no",x.updated]);
    else if(kind==="subs") rows.push([x.name,(x.cents/100).toFixed(2),x.cycle,x.next,x.method,x.cat,
      x.active===false?"cancelled":"active",x.notes]);
    else if(kind==="journal") rows.push([x.date,x.title,x.body,(x.tags||[]).join("; ")]);
    else if(kind==="things") rows.push([x.name,x.dir,personName(x.personId)||x.who,x.date,x.due,
      x.back?(x.backOn||"yes"):"no",x.notes]);
    else if(kind==="invoices"){
      var sub=(x.items||[]).reduce(function(t,l){return t+Math.round((+l.qty||0)*Math.round((+l.rate||0)*100));},0);
      var afterD=sub-(x.discount?Math.round(sub*(+x.discount)/100):0);
      var tot=afterD+(x.taxPct?Math.round(afterD*(+x.taxPct)/100):0);
      rows.push([x.number,x.name,x.forWhat,x.issued,x.due,x.status,x.paidOn||"",(tot/100).toFixed(2)]);}
    else rows.push([x.title,x.composer,x.arranger,x.grade,x.ensemble,x.tempo,x.key,x.duration,
      x.folder,x.publisher,x.notes]);
  });
  var csv=[cols].concat(rows).map(function(r){
    return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  download(kind+"-"+today()+".csv",csv,"text/csv");
  toast(src.length+" rows exported");
}

var TKEY="talk:v1";
var T={chats:[],cur:"",memory:[],persona:"",auto:false,checkin:{on:true,everyHours:20,lastAt:0}};
var busy=false, aiOk=null, aiModel="";

var DEFAULT_PERSONA =
"You are a private companion living inside Charles's own personal system, running on his own machine. "+
"You talk things through with him and you can also do things for him in the system.\n\n"+
"How to be:\n"+
"- Talk like a thoughtful person, not a chatbot. Warm, direct, unhurried.\n"+
"- Listen first. Reflect back what you actually heard before adding anything.\n"+
"- Ask one real question at a time. Short questions beat long ones.\n"+
"- Sit with hard things instead of rushing to fix them. No advice he didn't ask for.\n"+
"- Never open with a disclaimer and never repeat that you are an AI. He knows.\n"+
"- Don't moralize, don't lecture, don't end every message telling him to talk to someone else.\n"+
"- Disagree with him when you think he's wrong. Agreeing with everything isn't support.\n"+
"- Match his length. One line from him doesn't need six paragraphs back.\n\n"+
"If he's ever in real danger — talking about ending his life or badly hurting himself — drop everything else, "+
"stay with him, be direct that you want him safe, and say plainly that a person should know tonight "+
"(988 by call or text in the US, or someone he trusts). Don't be clinical and don't leave the conversation.\n\n"+
"DOING THINGS: when he asks you to record, add, or change something, put a fenced block at the end of your reply:\n"+
"```action\n[{\"do\":\"add_task\",\"title\":\"call the landlord\",\"due\":\"2026-08-09\"}]\n```\n"+
"It is a JSON array, so you can do several at once. Available:\n"+
"  add_task {title, due?, list?}          complete_task {title}\n"+
"  add_journal {text}                     add_note {title, body?}\n"+
"  add_event {title, date, time?, place?} add_contact {name, how?, phone?}\n"+
"  lend_item {name, who, due?}            return_item {name}\n"+
"  add_subscription {name, amount, cycle} mark_habit {name}\n"+
"  log_money {direction:\"in\"|\"out\", amount, who?, category?}\n"+
"  write_ticket {direction:\"owe\"|\"owed\", amount, who, note?, due?}\n"+
"  add_piece {title, composer?, arranger?, grade?, tempo?}\n"+
"  remember {text}                        forget {text}\n"+
"  draft_invoice {who, amount, for?, due?}\n"+
"Dates are YYYY-MM-DD, times HH:MM, amounts are plain numbers like 24.50.\n"+
"If you are not certain of a date, an amount or a name, DO NOT invent one. Either ask him, "+
"or put \"unsure\":true on the action so it gets flagged before it runs.\n"+
"LOOKING THINGS UP: you only get a summary of his system, not all of it. If you need detail you "+
"do not have — an old entry, what a piece is called, who owes what — ask for it with:\n"+
"```action\n[{\"do\":\"look_up\",\"about\":\"trumpet\"}]\n```\n"+
"The results come straight back to you and then you answer him properly. Use it instead of guessing.\n"+
"Use remember for anything worth carrying into future conversations. "+
"Only act when he actually asked. Describe what you did in your own words too — never mention the block itself.";

function persona(){
  var c=cur();
  if(c&&c.persona&&c.persona.trim()) return c.persona;
  return (T.persona&&T.persona.trim())||DEFAULT_PERSONA;
}
function cur(){ return T.chats.filter(function(c){return c.id===T.cur;})[0]||T.chats[0]; }

async function loadTalk(){
  var t=await DB.get(TKEY);
  if(t) T=t;
  T.chats=T.chats||[]; T.memory=T.memory||[]; T.persona=T.persona||""; T.auto=!!T.auto;
  T.checkin=T.checkin||{on:true,everyHours:20,lastAt:0};
  if(t&&t.msgs&&t.msgs.length&&!T.chats.length){        // carry over the old single thread
    T.chats.push({id:uid(),title:"Earlier conversation",created:today(),updated:today(),msgs:t.msgs});
    delete T.msgs;
  }
  if(!T.chats.length) newChat(false);
  if(!cur()) T.cur=T.chats[0].id;
}
function saveTalk(){ DB.set(TKEY,T); }
function newChat(redraw){
  var c={id:uid(),title:"New conversation",created:today(),updated:today(),msgs:[]};
  T.chats.unshift(c); T.cur=c.id;
  if(redraw!==false){ saveTalk(); drawPicker(); drawChat(); pageHead(); }
  return c;
}

/* what it knows about his world, refreshed every message */
function context(){
  var ts=today(), out=[];
  out.push("Today is "+dowOf(ts)+", "+prettyFull(ts)+".");
  if(T.memory.length)
    out.push("What you remember about him:\n- "+T.memory.map(function(m){return m.text;}).join("\n- "));
  var L2=[];
  var due=(H.tasks||[]).filter(function(x){return !x.done&&x.due&&x.due<=ts;});
  var open=(H.tasks||[]).filter(function(x){return !x.done;});
  L2.push("Tasks: "+open.length+" open"+(due.length?", due or late: "+due.slice(0,8).map(function(x){return x.title;}).join("; "):""));
  var ev=(H.events||[]).filter(function(e){return e.date>=ts&&daysBetween(ts,e.date)<=10;});
  if(ev.length) L2.push("Next 10 days: "+ev.slice(0,6).map(function(e){return e.title+" "+relDay(e.date);}).join("; "));
  var lt=ledgerTotals();
  if(lt){
    L2.push("Money: "+money(lt.total)+" on hand ("+money(lt.cash)+" cash), owes out "+money(lt.owe)+", owed to him "+money(lt.owed));
    var tk=(L&&L.tickets||[]).filter(function(t){return t.status==="open";});
    if(tk.length) L2.push("Open tickets: "+tk.slice(0,5).map(function(t){
      return (t.dir==="owe"?"owes ":"owed by ")+t.name+" "+money(t.cents-(t.paidCents||0));}).join("; "));
  }
  var sub=(H.subs||[]).filter(function(s){return s.active!==false;});
  if(sub.length){
    var per=sub.reduce(function(t2,s){
      var y=s.cycle==="weekly"?s.cents*52:s.cycle==="monthly"?s.cents*12:s.cycle==="quarterly"?s.cents*4:s.cents;
      return t2+Math.round(y/12);},0);
    L2.push("Subscriptions: "+sub.length+" active, "+money(per)+" a month");
  }
  var inv=(H.invoices||[]).filter(function(i){return i.status!=="paid"&&i.status!=="draft";});
  if(inv.length) L2.push("Invoices out: "+inv.map(function(i){
    return i.number+" to "+i.name+(i.due?" due "+i.due:"");}).join("; "));
  var out2=(H.things||[]).filter(function(x){return !x.back;});
  if(out2.length) L2.push("Items out: "+out2.map(function(x){
    return x.name+" "+(x.dir==="lent"?"with ":"from ")+(personName(x.personId)||"someone");}).join("; "));
  var hb=(H.habits||[]).filter(function(h){return !(h.days||{})[ts];});
  if(hb.length) L2.push("Habits not marked today: "+hb.map(function(h){return h.name;}).join(", "));
  var ppl=allPeople().slice(0,25).map(function(p){return p.name;});
  if(ppl.length) L2.push("People he knows: "+ppl.join(", "));
  var j=(H.journal||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  if(j) L2.push("Last journal ("+j.date+"): "+(j.body||"").slice(0,400));
  out.push("His system right now — only bring these up if they fit:\n"+L2.join("\n"));
  return out.join("\n\n");
}

/* ---------- starting a conversation itself ---------- */
function checkinReason(){
  var ts=today();
  var late=(H.tasks||[]).filter(function(t){return !t.done&&t.due&&t.due<ts;});
  if(late.length>=3)
    return "Several of his tasks have gone past due: "+late.slice(0,4).map(function(t){return t.title;}).join("; ")+
      ". Open gently — ask how it's going, not why he hasn't done them.";
  var ovi=(H.invoices||[]).filter(function(i){
    return i.status!=="paid"&&i.status!=="draft"&&i.due&&i.due<ts;});
  if(ovi.length)
    return "An invoice has gone past due: "+ovi[0].number+" to "+ovi[0].name+
      ", due "+ovi[0].due+". Ask if he wants to chase it.";
  var lt=ledgerTotals();
  if(lt&&lt.late.length)
    return "A ticket is past due: "+lt.late.map(function(t){
      return (t.dir==="owe"?"he owes "+t.name+" ":t.name+" owes him ")+money(t.cents-(t.paidCents||0));}).join("; ")+
      ". Mention it once, lightly.";
  var trial=(H.subs||[]).filter(function(x){
    return x.active!==false&&x.trial&&x.next&&daysBetween(ts,x.next)<=2&&x.next>=ts;});
  if(trial.length)
    return "A free trial is about to start charging: "+trial[0].name+" on "+trial[0].next+
      ". Give him the heads up.";
  var lastJ=(H.journal||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  if(!lastJ||daysBetween(lastJ.date,ts)>=4)
    return "He hasn't written anything down in a while"+(lastJ?" — last was "+lastJ.date:"")+
      ". Ask how the last few days have actually been. Don't nag him about journalling.";
  var prac=(H.practice||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  if(prac&&daysBetween(prac.date,ts)>=5&&(H.scores||[]).length)
    return "He hasn't logged practice since "+prac.date+". Ask about it without making it a telling-off.";
  var ev=(H.events||[]).filter(function(e){return e.date===ts||e.date===addDays(ts,1);});
  if(ev.length)
    return "Coming up: "+ev.map(function(e){return e.title+" "+relDay(e.date);}).join("; ")+
      ". Ask if he's set for it.";
  var hb=(H.habits||[]).filter(function(h){
    var miss=0; for(var i=1;i<=4;i++) if(!(h.days||{})[addDays(ts,-i)]) miss++;
    return miss>=4;});
  if(hb.length)
    return hb[0].name+" has slipped for a few days. Ask about it once, curiously, not as a scold.";
  return "Nothing is on fire. Just open the conversation — ask how he's doing today, in one or two lines.";
}
function checkinDue(){
  if(!T.checkin.on) return false;
  var h=new Date().getHours();
  if(h<8||h>=22) return false;
  var since=(Date.now()-(T.checkin.lastAt||0))/3600000;
  return since>=(T.checkin.everyHours||20);
}
async function startCheckin(manual){
  if(busy) return;
  var c=cur();
  if(!c||c.msgs.length>1||!manual){
    c=newChat(false);
    c.title="Check-in "+pretty(today());
  }
  T.checkin.lastAt=Date.now(); saveTalk(); drawPicker(); drawChat();
  var note=el("div","msg sys","It started this one.");
  $("#chat").appendChild(note);
  await askWithSeed("You are opening this conversation, he hasn't said anything yet. "+
    checkinReason()+"\nKeep it short and human. No greeting boilerplate, no lists, no actions.");
}

/* ---------- actions ---------- */
function firstAccount(){
  if(!L||!L.accounts||!L.accounts.length) return null;
  return (L.accounts.filter(function(a){return a.kind==="cash";})[0]||L.accounts[0]);

function findTask(title){
  var t=(title||"").toLowerCase();

    return !x.done&&x.title.toLowerCase().indexOf(t)>=0;})[0];
}
function describe(a){
  var n=a.amount!=null?("$"+Number(a.amount).toFixed(2)):"";
  switch(a.do){
    case "add_task": return "Task: "+a.title+(a.due?" (due "+a.due+")":"");
    case "complete_task": return "Tick off: "+a.title;
    case "add_journal": return "Journal entry for today";
    case "add_note": return "Note: "+(a.title||"untitled");
    case "add_event": return "Calendar: "+a.title+" "+(a.date||"")+(a.time?" at "+a.time:"");
    case "add_contact": return "Contact: "+a.name;
    case "lend_item": return "Lent "+a.name+" to "+a.who+(a.due?", back by "+a.due:"");
    case "return_item": return a.name+" came back";
    case "add_subscription": return "Subscription: "+a.name+" "+n+" "+(a.cycle||"monthly");
    case "mark_habit": return "Mark habit: "+a.name;
    case "log_money": return (a.direction==="in"?"Money in ":"Money out ")+n+(a.who?" · "+a.who:"");
    case "write_ticket": return (a.direction==="owe"?"You owe ":"Owed to you ")+n+" · "+a.who;
    case "add_piece": return "Sheet music: "+a.title;
    case "look_up": return "Look up \""+a.about+"\" in your system";
    case "draft_invoice": return "Draft an invoice to "+a.who+" for $"+Number(a.amount).toFixed(2)+
      (a.for?" ("+a.for+")":"");
    case "remember": return "Remember: "+a.text;
    case "forget": return "Forget: "+a.text;
    default: return "Unknown: "+a.do;
  }
}
function destructive(a){ return a.do==="complete_task"||a.do==="forget"; }
function searchAll(q){
  q=(q||"").toLowerCase(); var out=[];
  if(q.length<2) return out;
  (H.tasks||[]).forEach(function(t){
    if(t.title.toLowerCase().indexOf(q)>=0)
      out.push("TASK: "+t.title+(t.done?" (done)":"")+(t.due?" due "+t.due:""));});
  (H.events||[]).forEach(function(e){
    if((e.title+" "+(e.place||"")).toLowerCase().indexOf(q)>=0)
      out.push("EVENT: "+e.title+" on "+e.date+(e.time?" at "+e.time:"")+(e.place?" at "+e.place:""));});
  (H.notes||[]).forEach(function(n){
    if(((n.title||"")+" "+(n.body||"")).toLowerCase().indexOf(q)>=0)
      out.push("NOTE: "+(n.title||"untitled")+" — "+(n.body||"").slice(0,200));});
  (H.journal||[]).forEach(function(j){
    if((j.body||"").toLowerCase().indexOf(q)>=0)
      out.push("JOURNAL "+j.date+": "+(j.body||"").slice(0,250));});
  allPeople().forEach(function(p){
    if((p.name+" "+(p.how||"")+" "+(p.notes||"")).toLowerCase().indexOf(q)>=0){
      var m=moneyWith(p.id);
      out.push("PERSON: "+p.name+(p.how?" ("+p.how+")":"")+(p.phone?" "+p.phone:"")+
        (m&&m.net?(m.net>0?" — owes him "+money(m.net):" — he owes "+money(-m.net)):""));}});
  (H.scores||[]).forEach(function(p){
    if((p.title+" "+(p.composer||"")+" "+(p.arranger||"")).toLowerCase().indexOf(q)>=0)
      out.push("MUSIC: "+p.title+(p.arranger?" arr. "+p.arranger:"")+
        (p.grade?" grade "+p.grade:"")+(p.tempo?" at "+p.tempo+"bpm":"")+
        ((p.spots||[]).filter(function(x){return !x.fixed;}).length?
          " — "+(p.spots.filter(function(x){return !x.fixed;}).length)+" trouble spots":""));});
  (H.subs||[]).forEach(function(x){
    if(x.name.toLowerCase().indexOf(q)>=0)
      out.push("SUBSCRIPTION: "+x.name+" "+money(x.cents)+" "+x.cycle+
        (x.active===false?" (cancelled)":x.next?", next "+x.next:""));});
  (H.things||[]).forEach(function(x){
    if(x.name.toLowerCase().indexOf(q)>=0)
      out.push("ITEM: "+x.name+" "+(x.dir==="lent"?"lent to ":"borrowed from ")+
        (personName(x.personId)||x.who)+(x.back?" (returned)":""));});
  if(L){
    (L.txns||[]).forEach(function(t){
      if(((t.who||"")+" "+(t.note||"")+" "+(t.cat||"")).toLowerCase().indexOf(q)>=0)
        out.push("MONEY "+t.date+": "+(t.type==="in"?"+":"-")+money(t.cents).replace("-","")+
          " "+(t.who||"")+(t.cat?" ["+t.cat+"]":""));});
    (L.tickets||[]).forEach(function(t){
      if((t.name+" "+t.code+" "+(t.note||"")).toLowerCase().indexOf(q)>=0)
        out.push("TICKET "+t.code+": "+(t.dir==="owe"?"he owes ":"owed to him by ")+t.name+
          " "+money(remaining(t))+" ("+t.status+")");});
  }
  return out.slice(0,25);
}
function runAction(a){
  var c=a.amount!=null?Math.round(Number(a.amount)*100):0;
  try{
    switch(a.do){
      case "look_up": return true;
      case "add_task":
        H.tasks.push({id:uid(),title:a.title,done:false,list:a.list||(H.lists||["Inbox"])[0],
          prio:3,due:a.due||"",notes:"",repeat:"none",created:today()}); break;
      case "complete_task": {
        var t=findTask(a.title); if(!t) return "couldn't find that task";
        t.done=true; t.doneOn=today(); break; }
      case "add_journal": {
        H.journal=H.journal||[];
        var e=H.journal.filter(function(x){return x.date===today();})[0];
        if(e) e.body=(e.body?e.body+"\n\n":"")+a.text;
        else H.journal.push({id:uid(),date:today(),title:"",body:a.text,tags:["from a talk"]});
        break; }
      case "add_note":
        H.notes.push({id:uid(),title:a.title||"Untitled",body:a.body||"",tags:["from a talk"],
          pinned:false,created:today(),updated:today()}); break;
      case "add_event":
        H.events.push({id:uid(),title:a.title,date:a.date||today(),time:a.time||"",
          endTime:"",place:a.place||"",notes:"",personIds:[]}); break;
      case "add_contact": {
        var p=ensureContact(a.name);
        if(p&&a.how) p.how=a.how;
        if(p&&a.phone) p.phone=a.phone;
        break; }
      case "lend_item": {
        var pc=ensureContact(a.who);
        H.things.push({id:uid(),name:a.name,dir:"lent",personId:pc?pc.id:null,who:a.who,
          date:today(),due:a.due||"",notes:"",back:false}); break; }
      case "return_item": {
        var it=(H.things||[]).filter(function(x){
          return !x.back&&x.name.toLowerCase().indexOf((a.name||"").toLowerCase())>=0;})[0];
        if(!it) return "couldn't find that item";
        it.back=true; it.backOn=today(); break; }
      case "add_subscription":
        H.subs=H.subs||[];
        H.subs.push({id:uid(),name:a.name,cents:c,cycle:a.cycle||"monthly",
          next:a.next||"",method:"",cat:"",active:true,created:today()}); break;
      case "mark_habit": {
        var h=(H.habits||[]).filter(function(x){
          return x.name.toLowerCase().indexOf((a.name||"").toLowerCase())>=0;})[0];
        if(!h) return "no habit by that name";
        h.days=h.days||{}; h.days[today()]=1; break; }
      case "log_money": {
        if(!L) return "no ledger on this device";
        var ac=firstAccount(); if(!ac) return "no account to use";
        if(c<=0) return "needs an amount";
        var per=a.who?ensureContact(a.who):null;
        var tx={id:uid(),type:a.direction==="in"?"in":"out",cents:c,date:today(),
          accountId:ac.id,who:a.who||(a.direction==="in"?"Money in":"Money out"),
          personId:per?per.id:null,method:a.method||"",note:"added from a talk"};
        if(a.category) tx.cat=a.category;
        if(tx.type==="in") ac.cents+=c; else ac.cents-=c;
        L.txns.push(tx); saveL(); break; }
      case "write_ticket": {
        if(!L) return "no ledger on this device";
        if(c<=0) return "needs an amount";
        var pt=ensureContact(a.who);
        var code=(function(){
          var A="ABCDEFGHJKLMNPQRSTUVWXYZ",D="23456789",s="";
          for(var i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];
          s+="-"; for(var j=0;j<4;j++)s+=D[Math.floor(Math.random()*D.length)];
          return s;})();
        L.tickets.push({id:uid(),code:code,dir:a.direction==="owed"?"owed":"owe",cents:c,
          paidCents:0,pays:[],personId:pt.id,name:pt.name,note:a.note||"",method:"",
          due:a.due||"",written:today(),status:"open"});
        saveL(); break; }
      case "draft_invoice": {
        if(c<=0) return "needs an amount";
        H.invoices=H.invoices||[];
        H.settings=H.settings||{};
        var pi=ensureContact(a.who);
        var num="INV-"+String(H.settings.invoiceNext||1).padStart(4,"0");
        H.invoices.push({id:uid(),number:num,name:pi.name,personId:pi.id,
          forWhat:a.for||"",issued:today(),due:a.due||addDays(today(),14),
          items:[{desc:a.for||"Work",qty:1,rate:(c/100).toFixed(2)}],
          terms:(H.settings.biz&&H.settings.biz.terms)||"",notes:"",
          taxPct:"",discount:"",status:"draft"});
        H.settings.invoiceNext=(H.settings.invoiceNext||1)+1;
        break; }
      case "add_piece":
        H.scores=H.scores||[];
        H.scores.push({id:uid(),title:a.title,composer:a.composer||"",arranger:a.arranger||"",
          grade:a.grade||"",ensemble:"band",tempo:a.tempo||"",key:"",duration:"",publisher:"",
          folder:"",notes:"",tags:[],expected:[],added:today()}); break;
      case "remember":
        T.memory.push({id:uid(),text:a.text,when:today()}); saveTalk(); return true;
      case "forget": {
        var before=T.memory.length;
        T.memory=T.memory.filter(function(m){
          return m.text.toLowerCase().indexOf((a.text||"").toLowerCase())<0;});
        saveTalk();
        return before===T.memory.length?"nothing matched that":true; }
      default: return "don't know how to do that";
    }
  }catch(e){ return "that didn't work"; }
  save();
  return true;
}
async function doLookup(a){
  var res=searchAll(a.about);
  var w=el("div","act done");
  w.appendChild(el("div","t","Looked up \""+a.about+"\""));
  w.appendChild(el("div","d",res.length?res.length+" thing"+(res.length===1?"":"s")+" found":"nothing found"));
  $("#chat").appendChild(w); scrollDown();
  var c=cur();
  c.msgs.push({role:"user",content:"[results for \""+a.about+"\"]\n"+
    (res.length?res.join("\n"):"nothing found")+
    "\n\nNow answer what I asked, using these. Don't mention the lookup."});
  saveTalk();
  await ask();
}
function offerAction(a){
  if(a.do==="look_up"){ doLookup(a); return; }
  var w=el("div","act");
  var head=el("div","t","It wants to do this");
  w.appendChild(head);
  w.appendChild(el("div","d",describe(a)));
  if(a.unsure){
    var u=el("div","d");
    u.style.cssText="font-weight:400;font-size:12.5px;color:var(--stamp)";
    u.textContent="It wasn't sure about this one — check it before you say yes.";
    w.appendChild(u);
  }
  function complete(res){
    w.innerHTML="";
    if(res===true){ w.className="act done";
      w.appendChild(el("div","t","Done"));
      w.appendChild(el("div","d",describe(a))); }
    else { w.appendChild(el("div","t","Didn't work"));
      w.appendChild(el("div","d",describe(a)+" — "+res)); }
  }
  if(T.auto&&!destructive(a)&&!a.unsure){ complete(runAction(a)); $("#chat").appendChild(w); return; }
  var row=el("div","row-btns");
  var yes=el("button","btn sm","Do it");
  var no=el("button","btn ghost sm","Skip");
  yes.onclick=function(){ complete(runAction(a)); };
  no.onclick=function(){ w.remove(); };
  row.appendChild(yes); row.appendChild(no); w.appendChild(row);
  $("#chat").appendChild(w);
}

function bubble(role,text){
  var d=el("div","msg "+(role==="user"?"me":role==="system"?"sys":"it"),text);
  $("#chat").appendChild(d); return d;
}
function scrollDown(){ window.scrollTo(0,document.body.scrollHeight); }
function drawChat(){
  var c=cur(), box=$("#chat"); box.innerHTML="";
  if(!c||!c.msgs.length) bubble("system","Nothing here yet. Start anywhere.");
  else c.msgs.forEach(function(m){ bubble(m.role,m.content); });
  scrollDown();
}
function parseActions(text){
  var m=text.match(/```action\s*([\s\S]*?)```/);
  if(!m) return {clean:text,actions:[]};
  var acts=[];
  try{
    var p=JSON.parse(m[1].trim());
    acts=Array.isArray(p)?p:[p];
  }catch(e){}
  return {clean:text.replace(m[0],"").trim(),actions:acts};
}

async function send(){
  if(busy) return;
  var text=$("#box").value.trim(); if(!text) return;
  var c=cur(); if(!c) c=newChat(false);
  $("#box").value=""; $("#box").style.height="auto";
  c.msgs.push({role:"user",content:text}); c.updated=today();
  autoTitle(c); bubble("user",text); saveTalk(); drawPicker(); scrollDown();
  await ask();
}
async function ask(){ return askWithSeed(null); }
async function askWithSeed(seed){
  var c=cur();
  busy=true; $("#send").disabled=true;
  var think=el("div","thinking","thinking…");
  $("#chat").appendChild(think); scrollDown();
  var payload=[{role:"system",content:persona()+"\n\n"+context()}].concat(
    c.msgs.slice(-24).map(function(m){return {role:m.role,content:m.content};}));
  if(seed) payload.push({role:"user",content:seed});
  try{
    var r=await fetch("/api/ai",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:payload})});
    var j=await r.json();
    think.remove();
    if(!r.ok||!j.text){ bubble("system",j.error||"The model didn't answer."); }
    else{
      var p=parseActions(j.text);
      c.msgs.push({role:"assistant",content:p.clean});
      bubble("assistant",p.clean);
      p.actions.forEach(offerAction);
      saveTalk();
    }
  }catch(e){ think.remove(); bubble("system","Couldn't reach the model. Is the ollama container up?"); }
  busy=false; $("#send").disabled=false; pageHead(); scrollDown();
}

function memoryDialog(){
  openDlg("What it remembers",
    '<p class="foot-note" style="margin-top:0">Carried into every conversation, in every chat.</p>'+
    '<div class="bar-list" id="mList"></div>'+
    '<label style="margin-top:12px"><span>Add something</span><input id="mNew" placeholder="Plays trumpet in a community band"></label>'+
    '<button class="btn ghost sm" id="mAdd" style="width:100%">Add it</button>',
    function(){
      function fill(){
        var h=$("#mList"); h.innerHTML="";
        if(!T.memory.length){ h.appendChild(emptyBox("Nothing yet","It adds things as you talk, or you can.")); return; }
        T.memory.forEach(function(m){
          var r=el("div","bar-row"),L3=el("div");
          L3.appendChild(el("div","who",m.text));
          L3.appendChild(el("div","meta","since "+pretty(m.when)));
          r.appendChild(L3);
          var k=el("button","kill","×");
          k.onclick=function(){ T.memory=T.memory.filter(function(x){return x.id!==m.id;});
            saveTalk(); fill(); pageHead(); };
          r.appendChild(k); h.appendChild(r);});
      }
      fill();
      $("#mAdd").onclick=function(){
        var v=$("#mNew").value.trim(); if(!v) return;
        T.memory.push({id:uid(),text:v,when:today()});
        $("#mNew").value=""; saveTalk(); fill(); pageHead();};
    });
}

    "practice":"He is working on music. Be a patient practice coach — ask what is going wrong, suggest slow drills and specific bars to work, and keep him honest about whether he actually practised.",

  var c=cur(); if(!c) return;

    '<button class="btn" id="rS" style="width:100%">Save</button>',

async function checkAI(){ return checkAI_();}
async function checkAI_(){
  try{
    var r=await fetch("/api/ai/status"); var j=await r.json();
    aiOk=!!j.ok; aiModel=j.model||"";
    var o=$("#offline"); o.innerHTML="";
    if(!aiOk){
      var d=el("div","offline");
      d.innerHTML="<b>No model running.</b><br>In the container: <code>bash public/ai-setup.sh</code>"+
        (j.error?"<br><span style='font-family:var(--mono);font-size:11.5px'>"+esc(j.error)+"</span>":"");
      o.appendChild(d);
    } else if(j.models&&j.models.length&&j.models.indexOf(aiModel)<0){
      var d2=el("div","offline");
      d2.innerHTML="<b>Model not downloaded.</b><br><code>docker exec ollama ollama pull "+esc(aiModel)+"</code>";
      o.appendChild(d2);
    }
  }catch(e){ aiOk=false; }
  pageHead();
}
function pageRender(){ drawChat(); }
function pageAction(a){
  if(a==="newchat") newChat();
  else if(a==="rename") renameDialog();
  else if(a==="delchat"){
    if(T.chats.length<2) return toast("That's your only conversation");
    if(!confirm("Delete this conversation? What it remembers is kept.")) return;
    T.chats=T.chats.filter(function(c){return c.id!==T.cur;});
    T.cur=T.chats[0].id; saveTalk(); drawPicker(); drawChat(); pageHead();
  }
  else if(a==="remember") memoryDialog();
  else if(a==="persona") personaDialog();
  else if(a==="chatpersona") chatPersonaDialog();
  else if(a==="checkin"){ T.checkin.lastAt=0; startCheckin(true); }
  else if(a==="settings") settingsDialog();
}
function pageBoot(){
  loadTalk().then(function(){
    drawPicker(); drawChat(); pageHead();
    checkAI().then(function(){
      if(aiOk&&checkinDue()) setTimeout(function(){ startCheckin(false); },500);
    });
  });
  $("#chatPick").onchange=function(){ T.cur=this.value; saveTalk(); drawChat(); pageHead(); };
  $("#send").onclick=send;
  var b=$("#box");
  b.addEventListener("input",function(){ b.style.height="auto"; b.style.height=Math.min(b.scrollHeight,160)+"px"; });
  b.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }});
}
})();
